# App Template - Cloudflare Deployment Configuration
# Copy to wrangler.toml or use with opennextjs-cloudflare deploy

name = "app-template"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_APP_URL = "https://your-domain.in"

[env.production.vars]
NEXT_PUBLIC_APP_URL = "https://your-domain.in"

# Deployment commands:
#   npm run build:cf   # Build for Cloudflare
#   npm run deploy     # Deploy to production
#   npm run cf:dev     # Run locally with wrangler