name = "app-template"
main = ".open-next/worker.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# App URL (used for auth email links and cookie domain)
NEXT_PUBLIC_APP_URL = "https://your-app.example.com"
# Node environment
NODE_ENV = "development"
# Database (Neon Postgres or any PostgreSQL)
DATABASE_URL = "postgresql://user:password@host:5432/database?sslmode=require"
# JWT session secret — generate a strong random string, e.g. openssl rand -base64 32
JWT_SECRET = "change-me-with-a-long-random-secret"
# Resend (transactional email: verification + password reset)
RESEND_API_KEY = "re_1234567890"
EMAIL_FROM = "App Template <no-reply@yourdomain.in>"

[env.production.vars]
# App URL (used for auth email links and cookie domain)
NEXT_PUBLIC_APP_URL = "https://bima.vahankhata.in"
# Node environment
NODE_ENV = "production"
# Database (Neon Postgres or any PostgreSQL)
DATABASE_URL = "postgresql://da29d36150d1229637cabbb4da9b3f30aca7c916c9cbdba7c058e37abd9dd008:sk_WeApMkVaeyo210gAY1v5Z@db.prisma.io:5432/postgres?sslmode=require"
# JWT session secret — generate a strong random string, e.g. openssl rand -base64 32
JWT_SECRET = "change-me-with-a-long-random-secret"
# Resend (transactional email: verification + password reset)
RESEND_API_KEY = "re_1234567890"
EMAIL_FROM = "App Template <no-reply@yourdomain.in>"
# Cloudflare API token for cache clearance (get from: https://dash.cloudflare.com/profile/api-tokens)
# REQUIRED: Replace "your-cloudflare-api-token-here" with your real API token
CF_API_TOKEN = "your-cloudflare-api-token-here"
# Cloudflare Zone ID (get from: https://dash.cloudflare.com → Overview → Zone ID)
# REQUIRED: Replace "your-cloudflare-zone-id-here" with your real Zone ID
CF_ZONE_ID = "your-cloudflare-zone-id-here"

# After deploying to production, purge Cloudflare cache so new CSS/JS assets are served:
# Dashboard: Caching > Configuration > Clear Cache  (purge /_next/static/css/*)
# Or run the curl command from the deploy:cf script.
